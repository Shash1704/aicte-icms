<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AICTE Integrated Complaint Monitoring Dashboard — single-window tracking of institution-related complaints across Bureaus/Cells." />
    <title>AICTE Complaint Monitoring</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem('icms.theme.v3') || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
